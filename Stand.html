<script>
    const openings = [
        { name: "Sono Chi no Sadame", id: "1ZKAQzGYYSo" },
        { name: "BLOODY STREAM", id: "e0yrZXSXTSg" },
        { name: "STAND PROUD", id: "dOQWNEv4_6U" },
        { name: "End of THE WORLD", id: "fCMDad_YnBg" },
        { name: "Crazy Noisy Bizarre Town", id: "20m00ohYASw" },
        { name: "chase", id: "aCmJCQfINVU" },
        { name: "Great Days", id: "mU3vgXUKeFM" },
        { name: "Fighting Gold", id: "xgWr4cKD4AU" },
        { name: "Requiem for a Traitor", id: "6rX1EtxwLbk" },
        { name: "STONE OCEAN", id: "9l5VL-JM_Ws" },
        { name: "Heaven's falling down", id: "lr-PmLDr4RU" },
        { name: "SPIN", id: "6UF_qprQiu0" }
    ];

    let dernierOpening = -1;

    function choisirOpening() {
        let index;

        do {
            index = Math.floor(Math.random() * openings.length);
        } while (index === dernierOpening);

        dernierOpening = index;

        player.loadVideoById(openings[index].id);

        console.log("Opening : " + openings[index].name);
    }

    let player;

    function onYouTubeIframeAPIReady() {
        player = new YT.Player("youtube-player", {
            playerVars: {
                autoplay: 1,
                controls: 0,
                mute: 1,
                playsinline: 1
            },
            events: {
                onReady: choisirOpening,
                onStateChange: function(event) {
                    if (event.data === YT.PlayerState.ENDED) {
                        choisirOpening();
                    }
                }
            }
        });
    }
</script>
